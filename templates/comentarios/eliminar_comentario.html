{% extends "base.html" %}

{% load static %}

{% block banner %}
<section class="banner banner-articulos">
  <img src="{% static 'img/banner-post.webp' %}" alt="Banner de artículos del blog" class="banner-img"  loading="lazy">
</section>
{% endblock banner %}

{% block contenido %}

<div class="container my-5">
  <h2 class="text-center text-danger mb-4">Eliminar Comentario</h2>
  <p class="text-center">¿Estás seguro de que deseas eliminar este comentario?</p>

  <form method="post" class="d-flex flex-column align-items-center mt-4">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger">Sí, eliminar</button>
      <a href="{% url 'blog:detalle_articulo' object.articulo.pk %}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

{% endblock contenido %}
